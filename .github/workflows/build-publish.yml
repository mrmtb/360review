name: Build, Test and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  PUBLISH_PATH: './publish'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: false

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

      - name: Publish Application
        run: dotnet publish 360review.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --output ${{ env.PUBLISH_PATH }} --no-build

      - name: Generate Migration Scripts
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations script --project 360review.csproj --idempotent --output ${{ env.PUBLISH_PATH }}/migrations.sql

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 360review-${{ github.sha }}
          path: ${{ env.PUBLISH_PATH }}
          retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.yourdomain.com
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: 360review-${{ github.sha }}
          path: ./publish

      - name: Deploy to Staging Server
        shell: powershell
        run: |
          # This would use your deployment script or direct deployment
          Write-Host "Deploying to Staging..."
          # Example: Copy files to staging server
          # Or use Web Deploy, MSDeploy, etc.

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://yourdomain.com
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: 360review-${{ github.sha }}
          path: ./publish

      - name: Create Deployment Package
        shell: powershell
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath deployment-${{ github.sha }}.zip

      - name: Upload to Deployment Server
        shell: powershell
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          # Example: Upload to server using WinRM or other method
          Write-Host "Package ready for deployment"
          # The actual deployment would be triggered on the server side
          # using the enhanced DeployFromGithub.ps1 script
