name: Build and Deploy to Plesk

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: |
        dotnet restore 360review.csproj
        dotnet restore 360review.Tests/360review.Tests.csproj
      
    - name: Build
      run: dotnet build 360review.csproj --configuration Release --no-restore
      
    - name: Test
      run: dotnet test 360review.Tests/360review.Tests.csproj --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"
      continue-on-error: true
      
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: '**/*.trx'
        reporter: dotnet-trx
        
    - name: Publish Application
      run: dotnet publish 360review.csproj --configuration Release --output ./publish --no-build
      
    - name: Create Artifact
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./360review-${{ github.sha }}.zip
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 360review-app-${{ github.sha }}
        path: ./360review-${{ github.sha }}.zip
        retention-days: 30

  deploy-staging:
    name: Deploy to Staging (Plesk)
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: windows-latest
    environment: 
      name: staging
      url: https://staging.behavioralsurveys.com
    
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: 360review-app-${{ github.sha }}
        
    - name: Deploy to Plesk Staging
      shell: pwsh
      run: |
        # Setup WinRM connection
        $securePassword = ConvertTo-SecureString "${{ secrets.DEPLOY_PASSWORD }}" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential("${{ secrets.DEPLOY_USER }}", $securePassword)
        
        # Configure session options for HTTPS with valid SSL cert
        $sessionOptions = New-PSSessionOption -SkipCACheck -SkipCNCheck -SkipRevocationCheck
        
        # Create remote session using HTTPS (port 5986)
        $session = New-PSSession -ComputerName "rdp.behavioralsurveys.com" -Credential $credential -UseSSL -SessionOption $sessionOptions -Port 5986
        
        # Copy artifact to server
        Copy-Item -Path "./360review-${{ github.sha }}.zip" -Destination "C:\temp\" -ToSession $session
        
        # Execute deployment script directly without downloading artifact again
        Invoke-Command -Session $session -ScriptBlock {
          param($ZipFile, $Domain, $DbHost, $DbName, $DbUser, $DbPassword, $BackupPath, $PleskVhostsPath)
          
          $ErrorActionPreference = "Stop"
          Import-Module WebAdministration -ErrorAction SilentlyContinue
          
          # Set environment variables
          $env:DB_HOST = $DbHost
          $env:DB_NAME = $DbName
          $env:DB_USER = $DbUser
          $env:DB_PASSWORD = $DbPassword
          
          $SitePath = Join-Path $PleskVhostsPath "$Domain\httpdocs"
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupDir = $null
          
          try {
            Write-Host "Starting deployment for $Domain to $SitePath"
            
            # Stop app pool
            Write-Host "Stopping application pool: $Domain"
            if (Test-Path "IIS:\AppPools\$Domain") {
              Stop-WebAppPool -Name $Domain -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }
            
            # Backup current deployment and preserve config files
            if (Test-Path $SitePath) {
              $backupDir = Join-Path $BackupPath "$Domain-$timestamp"
              Write-Host "Creating backup at: $backupDir"
              if (-not (Test-Path $BackupPath)) {
                New-Item -ItemType Directory -Path $BackupPath -Force | Out-Null
              }
              Copy-Item -Path $SitePath -Destination $backupDir -Recurse -Force
              
              # Preserve existing appsettings.json
              $existingAppSettings = Join-Path $SitePath "appsettings.json"
              if (Test-Path $existingAppSettings) {
                Write-Host "Preserving existing appsettings.json"
                Copy-Item -Path $existingAppSettings -Destination "$env:TEMP\appsettings.json.preserve" -Force
              }
            }
            
            # Clear existing files (except protected directories)
            Write-Host "Clearing existing deployment files..."
            $excludeDirs = @("logs", "App_Data", "plesk-stat", "statistics", "error_docs", "_private")
            Get-ChildItem -Path $SitePath -ErrorAction SilentlyContinue | Where-Object { 
              $_.Name -notin $excludeDirs 
            } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            
            # Extract new deployment
            Write-Host "Extracting deployment from $ZipFile..."
            Expand-Archive -Path $ZipFile -DestinationPath $SitePath -Force
            
            # Restore preserved appsettings.json
            $preservedAppSettings = "$env:TEMP\appsettings.json.preserve"
            if (Test-Path $preservedAppSettings) {
              Write-Host "Restoring preserved appsettings.json"
              Copy-Item -Path $preservedAppSettings -Destination (Join-Path $SitePath "appsettings.json") -Force
              Remove-Item -Path $preservedAppSettings -Force
            }
            
            # Set permissions
            Write-Host "Setting permissions..."
            $acl = Get-Acl $SitePath
            $iisRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              "IIS_IUSRS", "Modify", "ContainerInherit,ObjectInherit", "None", "Allow"
            )
            $acl.SetAccessRule($iisRule)
            Set-Acl $SitePath $acl
            
            # Start app pool
            Write-Host "Starting application pool: $Domain"
            if (Test-Path "IIS:\AppPools\$Domain") {
              Start-WebAppPool -Name $Domain -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }
            
            Write-Host "Deployment completed successfully"
          } catch {
            Write-Host "Deployment failed: $_"
            
            # Rollback if we have a backup
            if ($backupDir -and (Test-Path $backupDir)) {
              Write-Host "Rolling back to backup..."
              Remove-Item "$SitePath\*" -Recurse -Force -ErrorAction SilentlyContinue
              Copy-Item "$backupDir\*" -Destination $SitePath -Recurse -Force
            }
            
            # Try to start app pool anyway
            if (Test-Path "IIS:\AppPools\$Domain") {
              Start-WebAppPool -Name $Domain -ErrorAction SilentlyContinue
            }
            
            throw
          }
        } -ArgumentList @(
          "C:\temp\360review-${{ github.sha }}.zip",
          "staging.behavioralsurveys.com",
          "${{ secrets.DB_HOST }}",
          "${{ secrets.DB_NAME }}",
          "${{ secrets.DB_USER }}",
          "${{ secrets.DB_PASSWORD }}",
          "C:\Plesk\Backups\${Domain}",
          "C:\Inetpub\vhosts"
        )
        
        # Cleanup
        Remove-PSSession $session

  deploy-production:
    name: Deploy to Production (Plesk)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: windows-latest
    environment: 
      name: production
      url: https://behavioralsurveys.com
    
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: 360review-app-${{ github.sha }}
        
    - name: Deploy to Plesk Production
      shell: pwsh
      run: |
        # Setup WinRM connection
        $securePassword = ConvertTo-SecureString "${{ secrets.DEPLOY_PASSWORD }}" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential("${{ secrets.DEPLOY_USER }}", $securePassword)
        
        # Create remote session
        $session = New-PSSession -ComputerName ${{ secrets.DEPLOY_SERVER }} -Credential $credential
        
        # Copy artifact to server
        Copy-Item -Path "./360review-${{ github.sha }}.zip" -Destination "C:\temp\" -ToSession $session
        
        # Execute deployment script
        Invoke-Command -Session $session -ScriptBlock {
          param($BuildNumber, $Domain, $DbHost, $DbName, $DbUser, $DbPassword)
          
          # Set environment variables for deployment
          $env:DB_HOST = $DbHost
          $env:DB_NAME = $DbName
          $env:DB_USER = $DbUser
          $env:DB_PASSWORD = $DbPassword
          $env:GH_PAT = "${{ secrets.GITHUB_TOKEN }}"
          
          # Run Plesk deployment script
          cd C:\Plesk\Scripts
          .\Deploy-Production-Plesk.ps1 -BuildNumber $BuildNumber -Domain $Domain
        } -ArgumentList @(
          "${{ github.sha }}",
          "behavioralsurveys.com",
          "${{ secrets.DB_HOST }}",
          "${{ secrets.DB_NAME }}",
          "${{ secrets.DB_USER }}",
          "${{ secrets.DB_PASSWORD }}"
        )
        
        # Cleanup
        Remove-PSSession $session
        
    - name: Notify Deployment Success
      if: success()
      run: |
        Write-Host "✅ Production deployment completed successfully!"
        Write-Host "Build: ${{ github.sha }}"
        Write-Host "URL: https://behavioralsurveys.com"
