          }
        } -ArgumentList @(
          "C:\temp\360review-${{ github.sha }}.zip",
          "behavioralsurveys.com",
          "${{ secrets.DB_HOST }}",
          "${{ secrets.DB_NAME }}",
          "${{ secrets.DB_USER }}",
          "${{ secrets.DB_PASSWORD }}",
