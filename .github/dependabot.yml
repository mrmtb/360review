version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    groups:
      nuget-security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]